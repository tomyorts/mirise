plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'jp.co.medident.mirailink'
version = '1.0.0'

android {
  namespace "jp.co.medident.mirailink.ptt"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // イヤホンのボタン(メディアボタン)を受け取る MediaSessionCompat
  implementation "androidx.media:media:1.7.0"
  // ServiceCompat.startForeground(サービス種別つき)
  implementation "androidx.core:core-ktx:1.13.1"
}
